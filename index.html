<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinevexo - Watch & Download Movies & TV Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { bg: '#0b0b14', surface: '#131326', card: '#1a1a36', border: '#2a2a4a', purple: '#a855f7', pink: '#ec4899' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0b14; color: #e2e8f0; }
    .text-gradient { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .bg-gradient-brand { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0b0b14; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 4px; }
  </style>
</head>
<body class="font-sans antialiased custom-scrollbar min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 bg-brand-bg/90 backdrop-blur-md border-b border-brand-border/40 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-2 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-brand flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
          <i class="fa-solid fa-play text-lg ml-0.5"></i>
        </div>
        <span class="font-display font-extrabold text-2xl tracking-wider text-gradient uppercase">Cinevexo</span>
      </a>
      <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search movies, series, genres..." class="w-full bg-brand-surface border border-brand-border/60 rounded-full py-2.5 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-purple-500">
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openLoginModal()" class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-brand-surface border border-brand-border/60 hover:border-purple-500 text-sm font-medium text-slate-200">
          <i class="fa-solid fa-user text-purple-400"></i> Login
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-10">
    <section class="relative rounded-3xl overflow-hidden bg-brand-surface border border-brand-border/40 shadow-2xl">
      <div id="heroSlide" class="relative min-h-[420px] sm:min-h-[480px] flex items-end p-6 sm:p-12 transition-all duration-700 bg-cover bg-center" style="background-image: url('https://image.tmdb.org/t/p/original/fm6KqXpk3M2HVveHwCrBSSBaO0V.jpg');">
        <div class="absolute inset-0 bg-gradient-to-t from-brand-bg via-brand-bg/60 to-transparent"></div>
        <div class="relative z-10 max-w-2xl space-y-4">
          <div class="flex items-center gap-2">
            <span id="heroQuality" class="px-2.5 py-1 text-xs font-bold rounded bg-purple-600 text-white">4K UHD</span>
            <span id="heroRating" class="px-2.5 py-1 text-xs font-semibold rounded bg-amber-500/20 text-amber-400 border border-amber-500/30"><i class="fa-solid fa-star text-xs"></i> 8.9</span>
          </div>
          <h1 id="heroTitle" class="text-3xl sm:text-5xl font-display font-extrabold text-white">Oppenheimer</h1>
          <p id="heroDesc" class="text-slate-300 text-sm sm:text-base line-clamp-3">The story of American scientist J. Robert Oppenheimer.</p>
          <div class="flex gap-4 pt-2">
            <button id="heroWatchBtn" onclick="openMovieModal(1)" class="px-6 py-3 rounded-xl bg-gradient-brand text-white font-semibold flex items-center gap-2 shadow-lg shadow-purple-500/30">
              <i class="fa-solid fa-play"></i> Watch / Download
            </button>
          </div>
        </div>
        <div class="absolute bottom-6 right-6 z-10 flex gap-2">
          <button onclick="prevHeroSlide()" class="w-10 h-10 rounded-full bg-brand-surface/80 border border-brand-border/60 text-white flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
          <button onclick="nextHeroSlide()" class="w-10 h-10 rounded-full bg-brand-surface/80 border border-brand-border/60 text-white flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </section>

    <!-- CATEGORIES -->
    <section class="space-y-4">
      <div class="flex items-center gap-3 overflow-x-auto pb-2 custom-scrollbar">
        <button onclick="filterCategory('all')" class="px-5 py-2.5 rounded-full text-sm font-medium bg-gradient-brand text-white whitespace-nowrap">All Movies</button>
        <button onclick="filterCategory('Featured')" class="px-5 py-2.5 rounded-full text-sm font-medium bg-brand-surface text-slate-300 border border-brand-border/60 whitespace-nowrap">Featured</button>
        <button onclick="filterCategory('Top IMDb')" class="px-5 py-2.5 rounded-full text-sm font-medium bg-brand-surface text-slate-300 border border-brand-border/60 whitespace-nowrap">Top IMDb</button>
      </div>
    </section>

    <!-- MOVIE GRID -->
    <section>
      <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6"></div>
    </section>
  </main>

  <!-- MODALS -->
  <div id="movieModal" class="fixed inset-0 z-50 hidden bg-brand-bg/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative w-full max-w-2xl bg-brand-surface border border-brand-border rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <button onclick="closeMovieModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-brand-card text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <div id="modalContent" class="space-y-6"></div>
    </div>
  </div>

  <div id="loginModal" class="fixed inset-0 z-50 hidden bg-brand-bg/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-brand-surface border border-brand-border rounded-3xl p-8 shadow-2xl space-y-6">
      <button onclick="closeLoginModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-brand-card text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-2xl font-display font-bold text-gradient text-center">Welcome to Cinevexo</h3>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <input type="email" required placeholder="Email Address" class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm text-white">
        <input type="password" required placeholder="Password" class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm text-white">
        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-brand text-white font-semibold">Sign In</button>
      </form>
    </div>
  </div>

  <div id="contactModal" class="fixed inset-0 z-50 hidden bg-brand-bg/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-brand-surface border border-brand-border rounded-3xl p-8 shadow-2xl space-y-6">
      <button onclick="closeContactModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-brand-card text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-2xl font-display font-bold text-white text-center">Customer Support</h3>
      <form onsubmit="handleSupportSubmit(event)" class="space-y-4">
        <input type="text" required placeholder="Your Name" class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm text-white">
        <input type="email" required placeholder="Your Email" class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm text-white">
        <textarea rows="4" required placeholder="Movie name or issue..." class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm text-white"></textarea>
        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-brand text-white font-semibold">Send Message</button>
      </form>
    </div>
  </div>

  <button onclick="openContactModal()" class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-gradient-brand text-white shadow-xl flex items-center justify-center hover:scale-110"><i class="fa-solid fa-headset text-xl"></i></button>

  <!-- LINK TO SEPARATE MOVIES FILE -->
  <script src="movies.js"></script>

  <!-- MAIN APP LOGIC -->
  <script>
    let currentHeroIndex = 0;
    function renderHero() {
      if(!moviesData || moviesData.length === 0) return;
      const movie = moviesData[currentHeroIndex];
      document.getElementById('heroSlide').style.backgroundImage = `url('${movie.backdrop}')`;
      document.getElementById('heroTitle').innerText = movie.title;
      document.getElementById('heroDesc').innerText = movie.description;
      document.getElementById('heroQuality').innerText = movie.quality;
      document.getElementById('heroRating').innerHTML = `<i class="fa-solid fa-star text-xs"></i> ${movie.rating}`;
      document.getElementById('heroWatchBtn').setAttribute('onclick', `openMovieModal(${movie.id})`);
    }
    function renderGrid(data) {
      const grid = document.getElementById('moviesGrid');
      if(!grid) return;
      grid.innerHTML = data.map(m => `
        <div onclick="openMovieModal(${m.id})" class="group relative rounded-2xl bg-brand-surface border border-brand-border/40 overflow-hidden shadow-lg hover:border-purple-500/50 cursor-pointer transition-all">
          <div class="relative aspect-[2/3] overflow-hidden">
            <img src="${m.poster}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            <span class="absolute top-3 right-3 px-2 py-0.5 text-xs font-bold rounded bg-purple-600 text-white">${m.quality}</span>
          </div>
          <div class="p-4 space-y-1">
            <h3 class="font-bold text-white text-base truncate">${m.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-2">${m.description}</p>
          </div>
        </div>
      `).join('');
    }
    function nextHeroSlide() { currentHeroIndex = (currentHeroIndex + 1) % moviesData.length; renderHero(); }
    function prevHeroSlide() { currentHeroIndex = (currentHeroIndex - 1 + moviesData.length) % moviesData.length; renderHero(); }
    function filterCategory(cat) { cat === 'all' ? renderGrid(moviesData) : renderGrid(moviesData.filter(m => m.category === cat)); }
    function handleSearch(q) { renderGrid(moviesData.filter(m => m.title.toLowerCase().includes(q.toLowerCase()) || m.description.toLowerCase().includes(q.toLowerCase()))); }
    function openMovieModal(id) {
      const movie = moviesData.find(m => m.id === id);
      if(!movie) return;
      document.getElementById('modalContent').innerHTML = `
        <div class="flex flex-col sm:flex-row gap-6">
          <img src="${movie.poster}" class="w-full sm:w-48 rounded-2xl object-cover shadow-lg" />
          <div class="space-y-3">
            <div class="flex items-center gap-2"><span class="px-2 py-0.5 text-xs font-bold rounded bg-purple-600 text-white">${movie.quality}</span><span class="text-amber-400 text-xs font-semibold"><i class="fa-solid fa-star"></i> ${movie.rating}</span></div>
            <h2 class="text-2xl font-display font-bold text-white">${movie.title}</h2>
            <p class="text-sm text-slate-300">${movie.description}</p>
            <a href="${movie.downloadLink}" target="_blank" class="block w-full py-3 px-4 rounded-xl bg-gradient-brand text-white font-semibold text-center"><i class="fa-solid fa-download"></i> Download / Watch Link</a>
          </div>
        </div>`;
      document.getElementById('movieModal').classList.remove('hidden');
    }
    function closeMovieModal() { document.getElementById('movieModal').classList.add('hidden'); }
    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
    function handleLogin(e) { e.preventDefault(); alert("Logged in successfully!"); closeLoginModal(); }
    function openContactModal() { document.getElementById('contactModal').classList.remove('hidden'); }
    function closeContactModal() { document.getElementById('contactModal').classList.add('hidden'); }
    function handleSupportSubmit(e) { e.preventDefault(); alert("Support message sent!"); closeContactModal(); }

    renderHero();
    renderGrid(moviesData);
  </script>
</body>
</html>
